# Tests run against a real MySQL instance (separate DB from dev) instead of H2.
# create-drop wipes and rebuilds the schema for every test run, so this MUST
# point at its own database, never at your dev "tixora" schema.
#
# CREATE DATABASE tixora_test;   -- run this once before testing

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventticketingsystemtest?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false