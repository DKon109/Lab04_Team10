spring.application.name=eventticketingsystem

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventticketingsystem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Frontend origin allowed to call the backend API directly.
tixora.cors.allowed-origin=${TIXORA_CORS_ALLOWED_ORIGIN:http://localhost:5173}
