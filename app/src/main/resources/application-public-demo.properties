# Personal hosting only. DB credentials are supplied by the hosting platform.
server.port=${PORT:10000}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# TiDB 8.5.3 needs FOR UPDATE without an alias-specific OF clause.
spring.jpa.database-platform=com.ooaf.eventticketing.config.PublicTiDBDialect
